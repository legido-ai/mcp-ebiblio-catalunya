name: Publish eBiblio Catalunya image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            EBIBLIO_BASE=ghcr.io/legido-ai/mcp-ebiblio:arm64
          tags: |
            ghcr.io/legido-ai/mcp-ebiblio-catalunya:latest
            ghcr.io/legido-ai/mcp-ebiblio-catalunya:arm64
